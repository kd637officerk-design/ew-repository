name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor & create Android project
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@7.6.10 @capacitor/cli@7.6.10 @capacitor/android@7.6.10
          npx cap add android
          mkdir -p android/app/src/main/res/values
          cp -r android-res/mipmap-* android/app/src/main/res/
          cp android-res/values/ic_launcher_background.xml android/app/src/main/res/values/
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SM=$(ls -1 "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            yes | "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bills-Cave-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
